#:schema ./.aviutl2-cli/aviutl2.schema.json

[project]
id = "sevenc-nanashi.enhanced_tracks-aux2"
name = "enhanced_tracks.aux2"
version = "0.1.0"

[artifacts.enhanced_tracks-aux2-tra2]
destination = "Script/enhanced_tracks-aux2/enhanced_tracks.aux2.tra2"
source = "src/track.lua"

[artifacts.enhanced_tracks-core]
destination = "Script/enhanced_tracks-aux2/enhanced_tracks_core.lua"
source = "src/track_impl.lua"

[artifacts.embedded-tra2]
destination = "Script/@embedded.tra2"
source = "build/@embedded.tra2"
build = "aulua build"
profiles.release.enabled = false

[artifacts.enhanced_tracks-aux2]
destination = "Plugin/enhanced_tracks.aux2"

[artifacts.enhanced_tracks-aux2.profiles.debug]
source = "target/debug/enhanced_tracks_aux2.dll"
build = ["aulua build", "cargo build"]

[artifacts.enhanced_tracks-aux2.profiles.release]
source = "target/release/enhanced_tracks_aux2.dll"
build = ["aulua build", "cargo build --release"]

[artifacts.enhanced_tracks_aux2-aul2]
destination = "Language/English.enhanced_tracks-aux2.aul2"
source = "i18n/English.aul2"

[development]
aviutl2_version = "latest"
catalog_dependencies = [
  "Garech.DoubleBPMGrid",
  "KuroNeko.CopyAlias",
  "sigma-axis.Basic_S",
  "sevenc-nanashi.insert-aux2",
  "sigma-axis.translations_sigma-axis",
  "aviutl2-community.aviutl2_community_translation_companion",
  "Mr-Ojii.L-SMASH-Works",
  "korarei.FlowType_K"
]

[release]
package_template = "./release/package.txt"
package_information = "{name} v{version} / 中間点ごとのイージングスクリプト切り替え+自由度の高い時間制御"
prebuild = ["cargo about generate ./about.hbs -o ./release/package.txt"]

[catalog]
id = "sevenc-nanashi.enhanced_tracks-aux2"
download_repo = { owner = "sevenc-nanashi", repo = "enhanced_tracks.aux2" }
license_path = "./LICENSE"
