#:schema ./.aviutl2-cli/aviutl2.schema.json

[project]
id = "sevenc-nanashi.enhanced_tracks-aux2"
name = "enhanced_tracks.aux2"
version = "0.1.0"

[artifacts.enhanced_tracks-aux2-tra2]
destination = "Script/enhanced_tracks.aux2.tra2"
source = "build/enhanced_tracks.aux2.tra2"
build = "aulua build"

[artifacts.embedded-tra2]
destination = "Script/@embedded.tra2"
source = "build/@embedded.tra2"
build = "aulua build"
profiles.release.enabled = false

[artifacts.enhanced_tracks-aux2]
destination = "Plugin/enhanced_tracks.aux2"

[artifacts.enhanced_tracks-aux2.profiles.debug]
source = "target/debug/enhanced_tracks_aux2.dll"
build = ["aulua build", "cargo build"]

[artifacts.enhanced_tracks-aux2.profiles.release]
source = "target/release/enhanced_tracks_aux2.dll"
build = ["aulua build", "cargo build --release"]

[development]
aviutl2_version = "latest"
catalog_dependencies = ["KuroNeko.CopyAlias", "sigma-axis.Basic_S", "sevenc-nanashi.insert-aux2"]

[release]
package_template = "./release/package.txt"
package_information = "{name} v{version} / 擬似的にキーフレーム的な動作を実現するためのプラグイン"
prebuild = ["cargo about generate ./about.hbs -o ./release/package.txt"]
