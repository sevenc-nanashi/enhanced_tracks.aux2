[package]
name = "enhanced_tracks-aux2"
version = "0.1.0-preview.27"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
aviutl2 = { version = "0.39.0", features = ["serde"] }
aviutl2-eframe = "0.39.0"
dashmap = "6.2.1"
egui_extras = { version = "0.35.0", features = ["svg"] }
encoding_rs = "0.8.35"
iconify = "0.3.1"
include_dir = "0.7.4"
indexmap = "2.14.0"
lazy-regex = "3.6.0"
nucleo-matcher = "0.3.1"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
tap = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_UI_HiDpi"] }

[patch.crates-io]
aviutl2 = { git = "https://github.com/sevenc-nanashi/aviutl2-rs" }
aviutl2-eframe = { git = "https://github.com/sevenc-nanashi/aviutl2-rs" }
